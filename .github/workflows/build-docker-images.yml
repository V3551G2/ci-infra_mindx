name: Build MindX build/test Docker Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Single image tag to build (without timestamp). Leave empty to build all.'
        required: false
        type: string
  push:
    paths:
      - image/**
      - .github/workflows/build-docker-images.yml

env:
  REGISTRY: swr.cn-north-4.myhuaweicloud.com
  SWR_ORG: ascend-mindx
  IMAGE_NAME: mindx_image

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine images to build
        id: set
        env:
          TAG_INPUT: ${{ inputs.tag }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          # 子目录 -> 该仓可构建的 tag 全集（与各仓 image/<dir>/docker_build.sh 的 case 保持一致）
          DIR_TAGS = {
              "IndexSDK": ["indexsdk-x86_64", "indexsdk-aarch64"],
              "RAGSDK": ["ragsdk-x86_64", "ragsdk-aarch64"],
              "MindCluster": ["mindcluster-ut_faultdialog_python-x86_64"],
              "RecSDK": ["recsdk-x86_64", "recsdk-aarch64"],
          }

          tag_input = os.environ.get("TAG_INPUT", "")
          before = os.environ.get("BEFORE", "")
          after = os.environ.get("AFTER", "")

          # tag -> 子目录 反查表
          tag_to_dir = {t: d for d, tags in DIR_TAGS.items() for t in tags}

          if tag_input:
              # workflow_dispatch 指定单个 tag
              if tag_input not in tag_to_dir:
                  print(f"::error::Unknown tag: {tag_input}")
                  sys.exit(1)
              target_dirs = [tag_to_dir[tag_input]]
          elif before and after and before != "0" * 40:
              # push：根据本次 push 改动的 image/<dir> 子目录自动确定
              try:
                  output = subprocess.check_output(
                      ["git", "diff", "--name-only", before, after]
                  ).decode()
                  changed = set()
                  for line in output.splitlines():
                      parts = line.split("/")
                      if len(parts) >= 2 and parts[0] == "image" and parts[1] in DIR_TAGS:
                          changed.add(parts[1])
                  target_dirs = sorted(changed)
              except Exception:
                  target_dirs = []
              # 未命中任何 image 子目录（例如只改了 workflow 文件）时回退到全量
              if not target_dirs:
                  target_dirs = list(DIR_TAGS.keys())
          else:
              # workflow_dispatch 未指定 tag：全量
              target_dirs = list(DIR_TAGS.keys())

          matrix = [{"tag": t, "dir": d} for d in target_dirs for t in DIR_TAGS[d]]
          data = json.dumps(matrix)
          print(f"Build matrix: {data}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={data}\n")
          PY

  build:
    needs: matrix
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ${{ contains(matrix.tag, 'x86_64') && 'ubuntu-latest' || 'ubuntu-22.04-arm' }}
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache
          docker system prune -af
          sudo apt clean && sudo apt autoremove -y
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to SWR
        env:
          SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
          SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}
        run: |
          if echo "$SWR_PASSWORD" | docker login "${{ env.REGISTRY }}" -u "$SWR_USERNAME" --password-stdin 2>/dev/null; then
            echo "SWR login succeeded"
            echo "SWR_LOGIN_OK=true" >> "$GITHUB_ENV"
          else
            echo "::warning::SWR login failed - image will be built but not pushed"
            echo "SWR_LOGIN_OK=false" >> "$GITHUB_ENV"
          fi

      - name: Build and push image
        run: |
          TIMESTAMP=$(date -u +%Y%m%d%H%M)
          cd image/${{ matrix.dir }}
          chmod +x ./docker_build.sh
          TIMESTAMP=${TIMESTAMP} ./docker_build.sh ${{ matrix.tag }}

          IMAGE_TAG="${{ matrix.tag }}-${TIMESTAMP}"
          REMOTE_IMAGE="${{ env.REGISTRY }}/${{ env.SWR_ORG }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
          docker tag "${IMAGE_TAG}" "${REMOTE_IMAGE}"
          if [ "$SWR_LOGIN_OK" = "true" ]; then
            # 大镜像跨境 push 容易挂死：单次 push 设 30min 超时并自动重试。
            # docker push 支持层断点续传（已推层直接 Layer already exists），重试代价低。
            echo "Pushing ${REMOTE_IMAGE} (max 5 attempts, 30min timeout each)..."
            PUSH_OK=false
            for attempt in 1 2 3 4 5; do
              echo "::group::Push attempt ${attempt}/5"
              if timeout 1800 docker push "${REMOTE_IMAGE}"; then
                PUSH_OK=true
                echo "::endgroup::"
                break
              fi
              echo "::endgroup::"
              echo "::warning::Push attempt ${attempt} failed or timed out, retrying..."
              sleep 15
            done
            if [ "${PUSH_OK}" = "true" ]; then
              mkdir -p /tmp/result
              echo "${REMOTE_IMAGE}" > "/tmp/result/${{ matrix.tag }}.txt"
              echo "Pushed ${REMOTE_IMAGE}"
            else
              echo "::error::Push failed after 5 attempts: ${REMOTE_IMAGE}"
              exit 1
            fi
          else
            echo "::warning::Skipped push because SWR login failed"
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.tag }}
          path: /tmp/result/${{ matrix.tag }}.txt
          retention-days: 1

  summary:
    needs: [matrix, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: /tmp/results
          merge-multiple: true

      - name: Generate summary
        run: |
          echo "## Docker Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| # | Image | Pull Command |" >> $GITHUB_STEP_SUMMARY
          echo "|---|-------|-------------|" >> $GITHUB_STEP_SUMMARY

          if [ -d /tmp/results ] && [ "$(ls -A /tmp/results 2>/dev/null)" ]; then
            COUNT=1
            for f in /tmp/results/*.txt; do
              IMAGE=$(cat "$f")
              echo "| ${COUNT} | \`${IMAGE##*:}\` | \`docker pull ${IMAGE}\` |" >> $GITHUB_STEP_SUMMARY
              COUNT=$((COUNT + 1))
            done
          else
            echo "| - | No images built | - |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.REGISTRY }}/${{ env.SWR_ORG }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY